<div class="alert-dialog">
  <div class="alert-header">
    <mat-icon
      [ngClass]="data.type"
      [style.color]="getIconColor()">
      {{ getIconClass() }}
    </mat-icon>
    <h2 mat-dialog-title class="alert-title">{{ data.title }}</h2>
  </div>

  <mat-dialog-content class="alert-content">
    <p class="alert-message">{{ data.message }}</p>
  </mat-dialog-content>

  <mat-dialog-actions class="alert-actions" align="end">
    <button
      mat-raised-button
      [color]="data.type === 'error' ? 'warn' : 'primary'"
      class="confirm-button"
      (click)="onConfirm()">
      {{ data.confirmText || 'OK' }}
    </button>
  </mat-dialog-actions>
</div>
